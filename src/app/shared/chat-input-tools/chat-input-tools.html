<div class="tools" appClickOutside (appClickOutside)="closeAll()">
  <button
    type="button"
    class="tools__btn"
    aria-label="Emoji einfügen"
    [disabled]="disabled()"
    (click)="toggleEmoji()"
  >
    <app-icon name="emoji" />
  </button>
  <button
    type="button"
    class="tools__btn"
    aria-label="Person erwähnen"
    [disabled]="disabled()"
    (click)="startMention()"
  >
    <span class="tools__at">&#64;</span>
  </button>

  @if (emojiOpen()) {
    <div class="tools__panel tools__panel--emoji">
      @for (emoji of emojis; track emoji) {
        <button type="button" class="tools__emoji" (click)="insertEmoji(emoji)">{{ emoji }}</button>
      }
    </div>
  }

  @if (mentionQuery() !== null) {
    <div
      class="tools__panel tools__panel--mention"
      role="listbox"
      [attr.aria-label]="mentionTrigger() === '#' ? 'Channels taggen' : 'Personen erwähnen'"
    >
      @for (suggestion of suggestions(); track suggestion.id; let index = $index) {
        <button
          type="button"
          class="tools__person"
          [class.tools__person--active]="index === activeIndex()"
          (click)="pickMention(suggestion)"
          (mouseenter)="activeIndex.set(index)"
        >
          @if (suggestion.avatarUrl) {
            <img class="tools__avatar" [src]="suggestion.avatarUrl" alt="" />
          } @else {
            <app-icon class="tools__hash" name="hash" />
          }
          {{ suggestion.label }}
        </button>
      } @empty {
        <p class="tools__empty">
          {{ mentionTrigger() === '#' ? 'Kein passender Channel.' : 'Keine passende Person.' }}
        </p>
      }
    </div>
  }
</div>
