<div class="auth-page">
  <app-header variant="auth-login" />
  <main class="auth-page__content">
    <section class="auth-card">
      <h1 class="auth-card__title">Anmeldung</h1>
      <p class="auth-card__subtitle">
        Wir empfehlen dir, die E-Mail-Adresse zu nutzen, die du bei der Arbeit verwendest.
      </p>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="auth-field">
          <label class="auth-field__pill" [class.auth-field__pill--invalid]="emailError()">
            <app-icon class="auth-field__icon" name="mail" />
            <input
              class="auth-field__input"
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="beispielname@email.com"
            />
          </label>
          <p class="auth-field__error" [class.is-visible]="emailError()" aria-live="polite">
            {{ emailError() }}
          </p>
        </div>

        <div class="auth-field">
          <label class="auth-field__pill" [class.auth-field__pill--invalid]="passwordError()">
            <app-icon class="auth-field__icon" name="lock" />
            <input
              class="auth-field__input"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Passwort"
            />
            <button
              type="button"
              class="auth-field__toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword() ? 'Passwort verbergen' : 'Passwort anzeigen'"
            >
              <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
            </button>
          </label>
          <p class="auth-field__error" [class.is-visible]="passwordError()" aria-live="polite">
            {{ passwordError() }}
          </p>
        </div>

        <a class="login__forgot" routerLink="/forgot-password">Passwort vergessen?</a>

        <p class="auth-form-error" [class.is-visible]="formError()" role="alert">
          {{ formError() }}
        </p>

        <div class="login__actions">
          <div class="login__divider"><span>ODER</span></div>

          <button
            type="button"
            class="auth-btn auth-btn--google"
            [disabled]="loading()"
            (click)="onGoogleLogin()"
          >
            <svg class="auth-btn__icon" viewBox="0 0 48 48" aria-hidden="true">
              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"
              />
              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65Z"
              />
              <path
                fill="#FBBC05"
                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19Z"
              />
              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"
              />
            </svg>
            @if (pending() === 'google') {
              <app-spinner />
            } @else {
              Anmelden mit Google
            }
          </button>

          <div class="login__actions-row">
            <button type="submit" class="auth-btn auth-btn--primary" [disabled]="loading()">
              @if (pending() === 'email') {
                <app-spinner />
              } @else {
                Anmelden
              }
            </button>
            <button
              type="button"
              class="auth-btn auth-btn--secondary"
              [disabled]="loading()"
              (click)="onGuestLogin()"
            >
              @if (pending() === 'guest') {
                <app-spinner />
              } @else {
                Gäste-Login
              }
            </button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <app-footer></app-footer>
</div>
