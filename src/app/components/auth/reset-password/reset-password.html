<div class="auth-page">
  <app-header variant="auth-register"></app-header>

  <main class="auth-page__content">
    <section class="auth-card">
      @if (hasCode) {
        <h1 class="auth-card__title">Passwort zurücksetzen</h1>

        <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <div class="auth-field">
            <label class="auth-field__pill">
              <app-icon class="auth-field__icon" name="lock" />
              <input
                class="auth-field__input"
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="new-password"
                placeholder="Neues Passwort"
              />
              <button
                type="button"
                class="auth-field__toggle"
                (click)="togglePasswordVisibility('password')"
                [attr.aria-label]="showPassword() ? 'Passwort verbergen' : 'Passwort anzeigen'"
              >
                <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
              </button>
            </label>
          </div>

          <div class="auth-field">
            <label class="auth-field__pill" [class.auth-field__pill--invalid]="mismatchError()">
              <app-icon class="auth-field__icon" name="lock" />
              <input
                class="auth-field__input"
                [type]="showConfirm() ? 'text' : 'password'"
                formControlName="confirm"
                autocomplete="new-password"
                placeholder="Neues Kennwort bestätigen"
              />
              <button
                type="button"
                class="auth-field__toggle"
                (click)="togglePasswordVisibility('confirm')"
                [attr.aria-label]="showConfirm() ? 'Passwort verbergen' : 'Passwort anzeigen'"
              >
                <app-icon [name]="showConfirm() ? 'eye-off' : 'eye'" />
              </button>
            </label>
            <p class="auth-field__error" [class.is-visible]="mismatchError()" aria-live="polite">
              {{ mismatchError() }}
            </p>
          </div>

          <p class="auth-form-error" [class.is-visible]="formError()" role="alert">
            {{ formError() }}
          </p>

          <div class="auth-actions">
            <a class="auth-btn auth-btn--secondary" routerLink="/login">
              <app-icon name="arrow-back" />
              Zurück
            </a>
            <button
              type="submit"
              class="auth-btn auth-btn--primary"
              [disabled]="formInvalid() || loading()"
            >
              @if (loading()) {
                <app-spinner />
              } @else {
                Passwort ändern
              }
            </button>
          </div>
        </form>
      } @else {
        <h1 class="auth-card__title">Ungültiger Link</h1>
        <p class="auth-card__subtitle">
          Dieser Link ist ungültig oder unvollständig. Bitte fordere eine neue Passwort-Reset-Mail
          an.
        </p>

        <div class="auth-actions auth-actions--center">
          <a class="auth-btn auth-btn--primary" routerLink="/forgot-password">
            Neuen Link anfordern
          </a>
        </div>
      }
    </section>
  </main>

  <app-footer></app-footer>
</div>

@if (success()) {
  <div class="toast-overlay" [class.toast-overlay--leaving]="leaving()">
    <app-toast message="Anmelden" />
  </div>
}
