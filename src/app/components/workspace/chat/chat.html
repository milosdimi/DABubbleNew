<div
  class="workspace"
  [class.workspace--thread-open]="threadMessage() !== null"
  [attr.data-mobile-view]="mobileView()"
>
  <app-header
    variant="app"
    [showBack]="mobileView() !== 'menu'"
    (backClicked)="goBack()"
    (channelSelected)="openChannel($event)"
    (userSelected)="openDirectChat($event)"
    (messageSelected)="showMessage($event)"
  />

  <div class="workspace__columns">
    <div
      class="workspace__side"
      [class.workspace__side--closed]="!sidebarOpen() && !isMobile()"
      [class.workspace__side--moving]="sidebarMoving()"
      (transitionend)="onSideTransitionEnd($event)"
    >
      @if (isMobile()) {
        <!-- Figma mobil (06): Suche "Gehe zu..." oben im Menue (Desktop: im Header). -->
        <app-search-bar
          class="workspace__mobile-search search--menu"
          placeholder="Gehe zu..."
          (channelSelected)="openChannel($event)"
          (userSelected)="openDirectChat($event)"
          (messageSelected)="showMessage($event)"
        />
      }
      <!-- Bleibt beim Schliessen im DOM, damit sie weich hinausgleiten kann. -->
      <app-sidebar
        [inert]="!sidebarOpen() && !isMobile()"
        [activeChannelId]="composing() ? null : (selectedChannel()?.id ?? null)"
        [activeUserId]="composing() ? null : (selectedUser()?.id ?? null)"
        (channelSelected)="openChannel($event)"
        (userSelected)="openDirectChat($event)"
        (newMessageClicked)="startNewMessage()"
      />

      <!-- Figma: senkrechter Reiter am linken Bildschirmrand. -->
      <button
        type="button"
        class="workspace__toggle"
        [attr.aria-expanded]="sidebarOpen()"
        (click)="toggleSidebar()"
      >
        <app-icon [name]="sidebarOpen() ? 'sidebar-close' : 'sidebar-open'" />
        <span>{{ sidebarOpen() ? 'Workspace-Menü schließen' : 'Workspace-Menü öffnen' }}</span>
      </button>
    </div>

    @if (composing()) {
      <app-new-message
        (sentToChannel)="showChannel($event)"
        (sentToUser)="showDirectChat($event)"
      />
    }

    <app-main-chat
      [class.workspace__hidden]="composing()"
      [focusMessageId]="focusMessageId()"
      (focusHandled)="focusMessageId.set(null)"
      [channel]="selectedChannel()"
      [user]="selectedUser()"
      (channelOpened)="showChannel($event)"
      (directChatOpened)="openDirectChat($event)"
      (replyClicked)="threadMessage.set($event)"
      (addMembersClicked)="addMembersChannelId.set($event)"
    />

    @if (threadMessage(); as message) {
      <app-thread
        [message]="message"
        (closed)="threadMessage.set(null)"
        (channelSelected)="showChannel($event)"
        (userSelected)="openDirectChat($event)"
      />
    }
  </div>
</div>

@if (addMembersChannelId(); as channelId) {
  <app-channel-add-members
    [channelId]="channelId"
    purpose="existing-channel"
    (closed)="addMembersChannelId.set(null)"
  />
}
