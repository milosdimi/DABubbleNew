<header class="header" [class.header--app]="variant() === 'app'" [class.header--back]="showBack()">
  @if (variant() === 'app') {
    <!-- Figma mobil (Component 2): Zurueck-Pfeil + Workspace statt DABubble-Logo. -->
    <button type="button" class="header__back" aria-label="Zurück" (click)="backClicked.emit()">
      <app-icon class="header__back-arrow" name="chevron-down" />
      <img class="header__back-logo" src="app-img/devspace-logo.svg" alt="" />
      <span class="header__back-name">Devspace</span>
    </button>
  }
  <a
    class="header__logo"
    [routerLink]="variant() === 'app' ? '/workspace' : '/login'"
    aria-label="DABubble"
  >
    <img class="header__logo-icon" src="app-img/bubble-logo.svg" alt="" />
    <span class="header__logo-text">DABubble</span>
  </a>

  @switch (variant()) {
    @case ('auth-login') {
      <div class="header__signup">
        <span class="header__signup-text">Neu bei DABubble?</span>
        <a class="header__signup-link" routerLink="/register">Konto erstellen</a>
      </div>
    }
    @case ('app') {
      <app-search-bar
        class="header__search-wrap"
        placeholder="Devspace durchsuchen"
        [shortcut]="true"
        (channelSelected)="channelSelected.emit($event)"
        (userSelected)="userSelected.emit($event)"
        (messageSelected)="messageSelected.emit($event)"
      />

      <div class="header__user" appClickOutside (appClickOutside)="menuOpen.set(false)">
        <button
          type="button"
          class="header__user-btn"
          [attr.aria-expanded]="menuOpen()"
          aria-haspopup="menu"
          (click)="toggleMenu()"
        >
          <span class="header__user-name">{{ displayName() }}</span>
          <span class="header__user-avatar-wrap">
            <img class="header__user-avatar" [src]="avatarUrl()" alt="" />
            <span class="header__online-dot" [attr.data-status]="status()"></span>
          </span>
          <app-icon name="chevron-down" />
        </button>

        @if (menuOpen()) {
          <!-- Mobil: abgedunkelter Hintergrund unter dem Bottom Sheet, Tipp schliesst. -->
          <div class="header__menu-backdrop" (click)="menuOpen.set(false)"></div>
          <app-profile-menu
            class="header__menu"
            [status]="chosenStatus()"
            [canChangeStatus]="!isGuest()"
            (statusSelected)="chooseStatus($event)"
            (profileClicked)="openOwnProfile()"
            (logoutClicked)="logout()"
          />
        }
      </div>
    }
  }
</header>

@if (profileOpen() && uid(); as ownUid) {
  <app-profile-card [userId]="ownUid" (closed)="profileOpen.set(false)" />
}
