<div class="dialog-backdrop" (click)="onBackdropClick()">
  <section class="dialog-card" (click)="$event.stopPropagation()">
    <header class="dialog-header">
      <h1 class="dialog-header__title">Dein Profil bearbeiten</h1>
      <button
        type="button"
        class="dialog-header__close"
        (click)="onCancel()"
        aria-label="Dialog schließen"
      >
        <app-icon name="close" />
      </button>
    </header>

    <div class="avatar-section">
      <div class="avatar-section__circle">
        <div class="avatar-section__image">
          <img [src]="avatarSrc(avatar())" alt="" />
        </div>
        <button
          type="button"
          class="avatar-section__edit"
          (click)="toggleAvatarPicker()"
          [attr.aria-expanded]="avatarPickerOpen()"
          aria-label="Avatar ändern"
        >
          <app-icon name="edit" />
        </button>
      </div>

      <!-- Immer im DOM und per Hoehen-Transition auf- und zugeklappt: kein Sprung im Dialog. -->
      <div
        class="avatar-picker-wrap"
        [class.avatar-picker-wrap--open]="avatarPickerOpen()"
        [inert]="!avatarPickerOpen()"
      >
        <div class="avatar-picker">
          @for (choice of avatarChoices; track choice) {
            <button
              type="button"
              class="avatar-picker__choice"
              [class.avatar-picker__choice--selected]="avatar() === choice"
              [attr.aria-pressed]="avatar() === choice"
              (click)="selectAvatar(choice)"
            >
              <img [src]="avatarSrc(choice)" alt="" />
            </button>
          }
        </div>
      </div>
    </div>

    <form class="dialog-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="dialog-field">
        <label class="dialog-field__label" for="profile-name">
          <!-- Figma mobil: Icon vor dem Label statt im Feld. -->
          <app-icon class="dialog-field__label-icon" name="account-circle" />
          Vollständiger Name
        </label>
        <label class="dialog-field__pill" [class.dialog-field__pill--invalid]="nameInvalid()">
          <app-icon class="dialog-field__icon" name="person" />
          <input
            id="profile-name"
            class="dialog-field__input"
            type="text"
            formControlName="name"
            placeholder="Vollständiger Name"
            (input)="nameEdited.set(true)"
          />
        </label>
        <p class="dialog-field__error" [class.is-visible]="fieldError()" role="alert">
          {{ fieldError() }}
        </p>
      </div>

      <div class="dialog-actions">
        <button type="button" class="dialog-btn dialog-btn--secondary" (click)="onCancel()">
          Abbrechen
        </button>
        <button
          type="submit"
          class="dialog-btn dialog-btn--primary"
          [disabled]="formInvalid() || loading()"
        >
          @if (loading()) {
            <app-spinner />
          } @else {
            Speichern
          }
        </button>
      </div>
    </form>
  </section>
</div>

@if (success()) {
  <div class="toast-overlay" [class.toast-overlay--leaving]="leaving()">
    <app-toast message="Profil gespeichert" />
  </div>
}
