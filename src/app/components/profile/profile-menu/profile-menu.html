<nav class="profile-menu" aria-label="Profilmenü">
  <button type="button" class="profile-menu__item" (click)="profileClicked.emit()">Profil</button>

  @if (canChangeStatus()) {
    <div class="profile-menu__status" role="radiogroup" aria-label="Status">
      @for (option of options; track option.value) {
        <button
          type="button"
          class="profile-menu__status-option"
          role="radio"
          [attr.aria-checked]="option.value === status()"
          (click)="statusSelected.emit(option.value)"
        >
          <span class="profile-menu__status-dot" [attr.data-status]="option.value"></span>
          {{ option.label }}
        </button>
      }
    </div>
  }

  <button type="button" class="profile-menu__item" (click)="logoutClicked.emit()">Log out</button>
</nav>
