# Container Station (QNAP): Anwendung erstellen und diese YAML einfuegen.
# Kein eigenes Image noetig: das offizielle node:22-alpine startet den Code aus
# dem Ordner /share/Container/dabubble-storage-api (siehe README).
# Platzhalter <...> vor dem Start ersetzen.

services:
  storage-api:
    image: node:22-alpine
    container_name: dabubble-storage-api
    restart: unless-stopped
    user: node
    working_dir: /home/node
    # Code schreibgeschuetzt einbinden, Abhaengigkeiten im Container installieren
    # (/home/node gehoert dem Benutzer node, dort darf er schreiben).
    volumes:
      - /share/Container/dabubble-storage-api:/src:ro
    command: >
      sh -c "mkdir -p app
      && cp -r /src/package.json /src/package-lock.json /src/src app/
      && cd app
      && npm ci --omit=dev --no-audit --no-fund
      && exec node src/server.js"
    environment:
      NODE_ENV: production
      PORT: "3000"
      S3_PUBLIC_ENDPOINT: https://storage.join-dimit.cc
      S3_INTERNAL_ENDPOINT: ""
      S3_REGION: us-east-1
      S3_BUCKET: chat-attachments
      S3_ACCESS_KEY: <MINIO_ACCESS_KEY>
      S3_SECRET_KEY: <MINIO_SECRET_KEY>
      FIREBASE_PROJECT_ID: dababble
      ALLOWED_ORIGINS: https://dabubble.dimit.cc,http://localhost:4200
      MAX_UPLOAD_BYTES: "10485760"
      UPLOADS_PER_HOUR: "20"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    # Kein Port nach aussen: erreichbar nur ueber den Cloudflare Tunnel im selben Netz.
    networks:
      - n8n-stack_default

networks:
  n8n-stack_default:
    external: true
